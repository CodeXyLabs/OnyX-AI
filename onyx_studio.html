<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OnyX Studio</title>
<style>
:root{--a:#FF2A1F;--c:#141416;--b:#2a2a2e;--g:#8e8e93}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;padding:14px;max-width:760px;margin:auto}
header{display:flex;align-items:baseline;gap:8px;margin:6px 0 12px}header b{font-size:26px}header span{color:var(--g);font-size:13px}
.card{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:14px;margin-bottom:12px}
canvas,video{width:100%;border-radius:14px;background:#000;display:block}
label{display:block;font-size:12px;color:var(--g);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
textarea,select,input[type=number],input[type=text]{width:100%;background:#0b0b0d;color:#fff;border:1px solid var(--b);border-radius:12px;padding:11px;font-size:16px;font-family:inherit}
textarea{min-height:76px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--a)}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.tabs{display:flex;background:var(--c);border-radius:14px;padding:4px;margin-bottom:12px;border:1px solid var(--b)}
.tabs button{flex:1;background:none;border:0;color:var(--g);padding:11px;border-radius:10px;font-size:16px;font-weight:600}
.tabs .on{background:var(--a);color:#fff}
.btn{background:var(--a);color:#fff;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;width:100%;margin-top:12px}
.btn.s{background:#2a2a2e}.btn:disabled{opacity:.5}
.dls{display:flex;gap:10px}.dls .btn{margin-top:10px}
#bar{height:6px;background:#222;border-radius:3px;margin-top:10px;overflow:hidden;display:none}#bar i{display:block;height:100%;width:0;background:var(--a)}
#msg{font-size:13px;color:var(--g);margin-top:8px;min-height:16px}
details{margin-top:10px}summary{cursor:pointer;color:#fff;font-weight:600;padding:6px 0}
.th{display:inline-block;position:relative;margin:6px 6px 0 0}.th img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid transparent}.th.on img{border-color:var(--a)}
.th b{position:absolute;top:-6px;right:-6px;background:#000;border:1px solid var(--b);border-radius:50%;width:20px;height:20px;text-align:center;font-size:13px;line-height:18px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px}.chk input{width:20px;height:20px;accent-color:var(--a)}
.hid{display:none}
</style></head><body>
<header><b>OnyX Studio</b><span>image &amp; video generator</span></header>
<div class="tabs"><button id="tI" class="on">Image</button><button id="tV">Video</button></div>
<div class="card"><canvas id="cv"></canvas><div id="bar"><i></i></div><div id="msg"></div><div id="vw"></div></div>
<div class="card">
<label>Prompt</label><textarea id="pr" placeholder="Describe what you want to create…">a cat in the forest at night</textarea>
<div class="row"><div><label>Engine</label><select id="en"><option value="ai">AI (online)</option><option value="pr">Procedural (offline)</option></select></div>
<div><label>Style</label><select id="sty"><option value="cinematic">Cinematic</option><option value="anime">Anime</option><option value="photo">Photo</option><option value="neon">Neon</option><option value="minimal">Minimal</option></select></div></div>
<div class="row"><div><label>Aspect</label><select id="as"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option></select></div>
<div><label>Quality</label><select id="q"><option value="1280">HD</option><option value="1920">Full HD</option><option value="720">Fast (720)</option></select></div>
<div><label>Seed</label><div class="row"><input id="seed" type="number" value="7" style="min-width:0"><button class="btn s" style="margin:0;width:52px;padding:0" id="dice">🎲</button></div></div></div>
<label>My images</label><input id="up" type="file" accept="image/*" multiple style="color:#8e8e93"><div id="ths"></div>
<div id="own" class="hid"><label>My image strength: <span id="bv">100</span>%</label><input id="bl" type="range" min="0" max="100" value="100"></div>
<details><summary>Effects &amp; caption</summary>
<div class="row"><div><label>Brightness</label><input class="fx" id="f1" type="range" min="50" max="150" value="100"></div><div><label>Contrast</label><input class="fx" id="f2" type="range" min="50" max="150" value="100"></div></div>
<div class="row"><div><label>Saturation</label><input class="fx" id="f3" type="range" min="0" max="200" value="100"></div><div><label>Blur</label><input class="fx" id="f4" type="range" min="0" max="10" value="0"></div></div>
<div class="row"><div><label>Vignette</label><input class="fx" id="f5" type="range" min="0" max="100" value="40"></div><div><label>Grain</label><input class="fx" id="f6" type="range" min="0" max="100" value="15"></div></div>
<label>Caption</label><input class="fx" id="cap" type="text" placeholder="Optional text on top"><label>Caption position</label><select class="fx" id="cp"><option value="b">Bottom</option><option value="c">Center</option><option value="t">Top</option></select></details>
<div id="iO"><details open><summary>Image export</summary><div class="row"><div><label>Format</label><select id="fmt"><option value="png">PNG</option><option value="jpeg">JPEG</option></select></div><div><label>JPEG quality</label><input id="jq" type="range" min="50" max="100" value="92"></div></div></details></div>
<div id="vO" class="hid"><details open><summary>Video settings</summary>
<div class="row"><div><label>Duration: <span id="dv">10</span>s</label><input id="du" type="range" min="4" max="40" value="10"></div><div><label>FPS</label><select id="fps"><option>30</option><option>60</option><option>24</option></select></div></div>
<div class="row"><div><label>Generated scenes: <span id="nv">3</span></label><input id="ns" type="range" min="0" max="8" value="3"></div><div><label>Motion</label><select id="mo"><option value="mx">Mixed</option><option value="zi">Zoom in</option><option value="zo">Zoom out</option><option value="pl">Pan left</option><option value="pr">Pan right</option></select></div></div>
<div class="row"><div><label>Transition</label><select id="tr"><option value="fade">Crossfade</option><option value="slide">Slide</option><option value="zoom">Zoom</option></select></div></div>
<label class="chk"><input id="ow" type="checkbox" checked> Use my images as scenes</label><label class="chk"><input id="mu" type="checkbox" checked> Add music</label></details></div>
<button class="btn" id="go">Generate image</button>
<div class="dls" id="dI"><button class="btn s" id="dp">⬇ PNG / JPEG</button></div>
<div class="dls hid" id="dV"><a id="dl" class="btn s hid" style="text-align:center;text-decoration:none">⬇ Download video</a></div>
</div>
<p style="color:#8e8e93;font-size:12px;text-align:center">AI mode uses the free pollinations.ai service (internet required). Procedural mode works offline and builds a scene from keywords in your prompt.</p>

async function getSrc(i,vary){const p=$('pr').value.trim()||'beautiful landscape',seed=+$('seed').value+i*97,st=STY[$('sty').value];

function frame(t){const N=sc.length,d=D/N,i=Math.min(N-1,Math.floor(t/d)),loc=t-i*d,tr=Math.min(.9,d*.4);cx.fillStyle='#000';cx.fillRect(0,0,W,H);paintScene(i,loc/d,t);
