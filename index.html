<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>OnyX 4.1 ULTIMATE</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 20, 0.6);
            --accent: #ff3b30;
            --text-main: #ffffff;
            --text-sec: #8e8e93;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Анимированный фон */
        .ambient-light {
            position: absolute;
            width: 150vw;
            height: 150vh;
            background: radial-gradient(circle at 50% 50%, rgba(255, 59, 48, 0.08), transparent 60%);
            top: -25%;
            left: -25%;
            z-index: -1;
            animation: pulseLight 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes pulseLight {
            0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
            100% { transform: scale(1.1) translate(-20px, -20px); opacity: 0.8; }
        }

        /* Header */
        header {
            padding: calc(var(--safe-top) + 15px) 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span { color: var(--accent); }

        .settings-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .settings-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.2); }
        .settings-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* Chat Area */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px calc(var(--safe-bottom) + 80px);
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--card-bg);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .message img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
            display: block;
        }

        /* Input Area */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px 15px calc(15px + var(--safe-bottom));
            background: linear-gradient(to top, var(--bg-color) 80%, transparent);
            display: flex;
            align-items: flex-end;
            gap: 10px;
            z-index: 20;
        }

        .input-wrapper {
            flex: 1;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within { border-color: var(--accent); }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            padding: 8px 0;
            line-height: 1.4;
        }

        textarea::placeholder { color: rgba(255,255,255,0.4); }

        .send-btn {
            background: var(--accent);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }

        .send-btn:disabled { opacity: 0.5; cursor: default; transform: none; }
        .send-btn:not(:disabled):active { transform: scale(0.9); }
        .send-btn svg { width: 20px; height: 20px; fill: currentColor; margin-left: 2px; }

        /* Animations & Loaders */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-sec);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .image-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px;
        }

        .spinner-ring {
            position: relative;
            width: 40px;
            height: 40px;
        }

        .spinner-ring::before, .spinner-ring::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .spinner-ring::before {
            width: 100%; height: 100%;
            border-top-color: var(--accent);
            border-bottom-color: var(--accent);
            animation: spin 1.5s linear infinite;
        }

        .spinner-ring::after {
            width: 70%; height: 70%;
            top: 15%; left: 15%;
            border-left-color: rgba(255,255,255,0.5);
            border-right-color: rgba(255,255,255,0.5);
            animation: spin-reverse 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

        .status-text {
            font-size: 0.8rem;
            color: var(--text-sec);
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.active { display: flex; opacity: 1; }

        .modal {
            background: #1a1a1a;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .modal-overlay.active .modal { transform: scale(1); }

        .modal h2 { margin: 0 0 15px; font-size: 1.4rem; color: var(--accent); }
        .modal p { color: var(--text-sec); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
        
        .modal input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .modal button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }

        .error-msg {
            color: #ff453a;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <header>
        <div class="logo">OnyX <span>4.1</span></div>
        <button class="settings-btn" id="settingsBtn" aria-label="Settings">
            <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
        </button>
    </header>

    <div id="chat-container">
        <!-- Сообщения будут здесь -->
        <div class="message ai">
            Привет! Я OnyX 4.1. Настрой токен Hugging Face в настройках (⚙️), чтобы начать общение.
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" rows="1" placeholder="Сообщение..."></textarea>
        </div>
        <button class="send-btn" id="sendBtn" disabled>
            <svg viewBox="0 0 24 24"><path d="M2.01,21L23,12L2.01,3L2,10l15,2l-15,2L2.01,21z"/></svg>
        </button>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>Настройки API</h2>
            <p>Введите ваш токен Hugging Face для работы нейросети.<br>Получить бесплатно: <a href="https://huggingface.co/settings/tokens" target="_blank" style="color:var(--accent)">huggingface.co</a></p>
            <input type="password" id="apiToken" placeholder="hf_...">
            <div class="error-msg" id="tokenError">Неверный формат токена</div>
            <button id="saveTokenBtn">Сохранить</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatContainer = document.getElementById('chat-container');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsModal = document.getElementById('settingsModal');
            const apiTokenInput = document.getElementById('apiToken');
            const saveTokenBtn = document.getElementById('saveTokenBtn');
            const tokenError = document.getElementById('tokenError');

            let hfToken = localStorage.getItem('hf_token') || '';

            // Инициализация
            if (!hfToken) {
                setTimeout(() => {
                    settingsModal.classList.add('active');
                }, 500);
            } else {
                apiTokenInput.value = hfToken;
            }

            // Авто-ресайз textarea
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                if(this.value.trim() === '') {
                    this.style.height = 'auto';
                    sendBtn.disabled = true;
                } else {
                    sendBtn.disabled = false;
                }
            });

            // Отправка по Enter (без Shift)
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            sendBtn.addEventListener('click', sendMessage);

            settingsBtn.addEventListener('click', () => {
                settingsModal.classList.add('active');
            });

            saveTokenBtn.addEventListener('click', () => {
                const token = apiTokenInput.value.trim();
                if (token.startsWith('hf_')) {
                    localStorage.setItem('hf_token', token);
                    hfToken = token;
                    settingsModal.classList.remove('active');
                    tokenError.style.display = 'none';
                    // Очищаем чат при первом успешном входе, если там только приветствие
                    if(chatContainer.children.length === 1) {
                        chatContainer.innerHTML = '';
                        addMessage('ai', 'Токен сохранен. Чем могу помочь?');
                    }
                } else {
                    tokenError.style.display = 'block';
                }
            });

            // Закрытие модалки по клику вне
            settingsModal.addEventListener('click', (e) => {
                if (e.target === settingsModal) {
                    if(hfToken) settingsModal.classList.remove('active');
                }
            });

            function addMessage(role, text, isHtml = false) {
                const div = document.createElement('div');
                div.className = `message ${role}`;
                if (isHtml) {
                    div.innerHTML = text;
                } else {
                    div.textContent = text;
                }
                chatContainer.appendChild(div);
                scrollToBottom();
                return div;
            }

            function addLoader(type) {
                const div = document.createElement('div');
                div.className = `message ai ${type}-loader-container`;
                
                if (type === 'text') {
                    div.innerHTML = `<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
                } else if (type === 'image') {
                    div.innerHTML = `
                        <div class="image-loader">
                            <div class="spinner-ring"></div>
                            <div class="status-text">Генерация изображения...</div>
                        </div>
                    `;
                }
                
                chatContainer.appendChild(div);
                scrollToBottom();
                return div;
            }

            function scrollToBottom() {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            async function sendMessage() {
                const text = userInput.value.trim();
                if (!text) return;

                if (!hfToken) {
                    settingsModal.classList.add('active');
                    return;
                }

                // Добавляем сообщение пользователя
                addMessage('user', text);
                userInput.value = '';
                userInput.style.height = 'auto';
                sendBtn.disabled = true;

                // Определяем тип запроса
                const isImageRequest = text.toLowerCase().includes('нарисуй') || text.toLowerCase().includes('изображение') || text.toLowerCase().includes('картинку') || text.toLowerCase().includes('photo');

                if (isImageRequest) {
                    const loader = addLoader('image');
                    try {
                        const response = await fetch(
                            "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0",
                            {
                                method: "POST",
                                headers: {
                                    "Authorization": `Bearer ${hfToken}`,
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({ inputs: text })
                            }
                        );

                        if (!response.ok) throw new Error('API Error');

                        const blob = await response.blob();
                        const imgUrl = URL.createObjectURL(blob);
                        
                        loader.remove();
                        const msgDiv = addMessage('ai', '', true);
                        msgDiv.innerHTML = `Вот что получилось:<br><img src="${imgUrl}" alt="Generated Image" loading="lazy">`;
                        
                    } catch (error) {
                        loader.remove();
                        addMessage('ai', 'Ошибка генерации изображения. Проверьте токен или модель.');
                        console.error(error);
                    }
                } else {
                    const loader = addLoader('text');
                    try {
                        const response = await fetch(
                            "https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3",
                            {
                                method: "POST",
                                headers: {
                                    "Authorization": `Bearer ${hfToken}`,
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({ 
                                    inputs: `[INST] Ты полезный ассистент OnyX. Отвечай кратко и по делу. ${text} [/INST]`,
                                    parameters: { max_new_tokens: 256, return_full_text: false }
                                })
                            }
                        );

                        if (!response.ok) {
                            const errData = await response.json();
                            if (errData.error && errData.error.includes('loading')) {
                                loader.remove();
                                addMessage('ai', 'Модель загружается. Попробуйте через 30 секунд.');
                                return;
                            }
                            throw new Error('API Error');
                        }

                        const data = await response.json();
                        loader.remove();
                        
                        let reply = "Нет ответа.";
                        if (Array.isArray(data) && data[0].generated_text) {
                            reply = data[0].generated_text.trim();
                        } else if (data.generated_text) {
                            reply = data.generated_text.trim();
                        }

                        // Простая обработка переносов строк
                        reply = reply.replace(/\n/g, '<br>');
                        addMessage('ai', reply, true);

                    } catch (error) {
                        loader.remove();
                        addMessage('ai', 'Ошибка соединения с нейросетью. Проверьте токен.');
                        console.error(error);
                    }
                }
            }
        });
    </script>
</body>
</html>
